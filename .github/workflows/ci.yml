name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-code/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-code/mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
